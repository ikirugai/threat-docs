# GitHub Pages Jekyll configuration for the THREAT Pro methodology
# document.  Cayman is a clean, technical-looking theme that renders
# tables and code blocks well — appropriate for a specialist-facing
# reference page.

title: THREAT Pro — Methodology
description: Model, assumptions, and validation results for the THREAT Pro HVM + blast safety simulator.
